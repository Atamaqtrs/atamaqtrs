<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio — Atamaqtrs</title>
<meta name="description" content="Atamaqtrs — full portfolio" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=14" />
<style>
  /* This page isn't part of the one-page scroller, so it needs a normal
     document-flow layout instead of the .panel/#scroll-container system. */
  body { padding: 90px clamp(20px, 6vw, 96px) 100px; }
  .gallery-wrap { max-width: 960px; margin: 0 auto; }
  .gallery-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 32px;
  }
  .gallery-back {
    font-family: var(--font-display);
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-decoration: none;
    color: var(--fg);
    border-bottom: 1px solid var(--fg);
    padding-bottom: 2px;
  }
  .gallery-back:hover { opacity: 0.75; }
</style>
</head>
<body>

<div id="lang-switch" aria-label="Language switch">
  <button type="button" data-lang-btn="en">EN</button>
  <button type="button" data-lang-btn="ja">JA</button>
</div>

<div class="gallery-wrap">
  <div class="gallery-header">
    <a class="gallery-back" href="index.html#portfolio" data-i18n="portfolio.gallery.back">← Atamaqtrs</a>
    <h2 data-i18n="portfolio.heading">Portfolio</h2>
  </div>

  <div id="portfolio">
    <div id="portfolio-grid" class="portfolio-grid"></div>

    <!-- Detail overlay: shown when URL hash is #/portfolio/<id> -->
    <div id="portfolio-detail" class="portfolio-detail" hidden>
      <button type="button" class="portfolio-back" data-i18n="portfolio.back">← Back to list</button>
      <div class="portfolio-detail-content"></div>
      <h3 class="portfolio-other-heading" data-i18n="portfolio.other">More work</h3>
      <div id="portfolio-other-grid" class="portfolio-grid portfolio-grid--small"></div>
    </div>
  </div>
</div>

<script src="js/i18n.js?v=8"></script>
<script src="js/portfolio.js?v=9"></script>
</body>
</html>
